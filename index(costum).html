        <script>
          const quotes = [
              "Teknologi berkembang pesat, dan semangat belajar adalah bahan bakarnya.",
              "Setiap hari adalah kesempatan untuk menambah pengetahuan.",
              "Kita mempersiapkan diri untuk menghadapi perubahan.",
              "Bersama, kita bentuk inovasi.",
              "Inovasi dimulai dengan ide-ide segar dan semangat yang tidak pernah padam.",
              "Jangan hanya mengikuti perkembangan teknologi; ciptakan perubahan dan jadilah bagian dari masa depan. Pengetahuan adalah kekuatan untuk menciptakan mimpi yang tidak terbatas",
          ];
  
          function getRandomQuote() {
              const randomIndex = Math.floor(Math.random() * quotes.length);
              return quotes[randomIndex];
          }
  
          document.getElementById('quote').innerText = getRandomQuote();
      </script>
